name: wakebridge-dev
services:
  db:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: wakebridge
      POSTGRES_PASSWORD: change-this-development-password
      POSTGRES_DB: wakebridge
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-dev:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wakebridge -d wakebridge"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  postgres-dev:
