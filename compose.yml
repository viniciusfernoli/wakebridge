name: wakebridge
services:
  db:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-wakebridge}
    volumes: ["postgres:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: api
    environment:
      DATABASE_URL: ${DATABASE_URL:?Use the db hostname, not localhost, in production}
      WEB_ORIGIN: https://${DOMAIN:?Set DOMAIN}
      NODE_ENV: production
      PORT: 4100
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      WAKE_TIMEOUT_MS: ${WAKE_TIMEOUT_MS:-120000}
      COMMAND_ACK_TIMEOUT_MS: ${COMMAND_ACK_TIMEOUT_MS:-8000}
      RELAY_RETRY_MS: ${RELAY_RETRY_MS:-20000}
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      start_period: 30s
      timeout: 5s
      retries: 10
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: web
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    init: true
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web, api]
    restart: unless-stopped
volumes:
  postgres:
  caddy-data:
  caddy-config:
